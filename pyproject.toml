[project]
name = "compound-poisson"
version = "0.2.0"
description = "Compound Poisson claim process and aggregate loss stats."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Source = "https://github.com/MichaelSwann2x/compound-poisson"
Original = "https://github.com/mirkovicdev/stokmod"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compound_poisson"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
